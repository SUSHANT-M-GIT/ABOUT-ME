<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Card -->
  <rect x="250" y="60" width="700" height="520" rx="20" fill="white" filter="drop-shadow(0 8px 32px rgba(0,0,0,0.08))"/>

  <!-- Logo -->
  <text x="400" y="140" font-family="Georgia, serif" font-size="40" font-weight="800" fill="#0f172a">Link</text>
  <text x="490" y="140" font-family="Georgia, serif" font-size="40" font-weight="800" fill="#0d9488">Shield</text>
  <text x="572" y="136" font-family="sans-serif" font-size="22" fill="#0d9488">⛓</text>

  <!-- Tagline -->
  <text x="400" y="176" font-family="sans-serif" font-size="16" fill="#64748b">Paste a link and see how it scores before you click it.</text>

  <!-- Input label -->
  <text x="400" y="232" font-family="sans-serif" font-size="13" font-weight="600" fill="#374151">Website URL</text>

  <!-- Input box -->
  <rect x="390" y="244" width="420" height="48" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="273" font-family="sans-serif" font-size="15" fill="#94a3b8">https://example.com/login</text>

  <!-- Check button -->
  <rect x="390" y="308" width="420" height="52" rx="8" fill="url(#btn)"/>
  <text x="556" y="338" font-family="sans-serif" font-size="17" font-weight="600" fill="white">Check link</text>

  <!-- Try examples -->
  <text x="400" y="400" font-family="sans-serif" font-size="14" fill="#64748b">Try an example:</text>

  <!-- Example chips -->
  <rect x="390" y="416" width="110" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="438" font-family="sans-serif" font-size="14" fill="#374151">Wikipedia</text>

  <rect x="514" y="416" width="150" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="535" y="438" font-family="sans-serif" font-size="14" fill="#374151">Suspicious login</text>

  <rect x="678" y="416" width="130" height="36" rx="18" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="698" y="438" font-family="sans-serif" font-size="14" fill="#374151">Raw IP address</text>

  <!-- Result preview -->
  <rect x="390" y="474" width="420" height="80" rx="10" fill="rgba(220,252,231,0.6)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="416" y="508" font-family="sans-serif" font-size="22">✅</text>
  <text x="456" y="503" font-family="sans-serif" font-size="15" font-weight="700" fill="#065f46">Legitimate</text>
  <text x="456" y="522" font-family="sans-serif" font-size="13" fill="#047857">Confidence: 99.2% · CNN-BiLSTM Model</text>

  <!-- Bottom disclaimer -->
  <text x="400" y="570" font-family="sans-serif" font-size="12" fill="#94a3b8">Machine-learning results are informational only. Always verify suspicious links independently.</text>

  <!-- Accuracy badge on the right -->
  <rect x="980" y="80" width="180" height="100" rx="12" fill="#0f172a"/>
  <text x="1050" y="128" font-family="sans-serif" font-size="30" font-weight="800" fill="white" text-anchor="middle">97.75%</text>
  <text x="1050" y="150" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Test Accuracy</text>

  <rect x="980" y="196" width="180" height="100" rx="12" fill="rgba(13,148,136,0.1)" stroke="rgba(13,148,136,0.3)" stroke-width="1"/>
  <text x="1050" y="244" font-family="sans-serif" font-size="28" font-weight="800" fill="#0d9488" text-anchor="middle">0.9980</text>
  <text x="1050" y="266" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">ROC-AUC Score</text>

  <rect x="980" y="312" width="180" height="100" rx="12" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="1050" y="360" font-family="sans-serif" font-size="28" font-weight="800" fill="#ef4444" text-anchor="middle">+6 pts</text>
  <text x="1050" y="382" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">vs XGBoost baseline</text>

  <!-- Left side model info -->
  <text x="30" y="140" font-family="sans-serif" font-size="13" font-weight="700" fill="#374151">Model Architecture</text>
  <rect x="30" y="156" width="180" height="30" rx="6" fill="rgba(13,148,136,0.1)" stroke="rgba(13,148,136,0.3)" stroke-width="1"/>
  <text x="50" y="175" font-family="sans-serif" font-size="12" fill="#0d9488">CNN-BiLSTM + Features</text>

  <text x="30" y="218" font-family="sans-serif" font-size="12" fill="#64748b">339,723 URLs trained</text>
  <text x="30" y="238" font-family="sans-serif" font-size="12" fill="#64748b">12 structural features</text>
  <text x="30" y="258" font-family="sans-serif" font-size="12" fill="#64748b">Character-level CNN</text>
  <text x="30" y="278" font-family="sans-serif" font-size="12" fill="#64748b">Bidirectional LSTM</text>
  <text x="30" y="298" font-family="sans-serif" font-size="12" fill="#64748b">Feature fusion</text>

  <text x="30" y="340" font-family="sans-serif" font-size="13" font-weight="700" fill="#374151">Stack</text>
  <text x="30" y="362" font-family="sans-serif" font-size="12" fill="#64748b">Python · TensorFlow</text>
  <text x="30" y="382" font-family="sans-serif" font-size="12" fill="#64748b">Keras · XGBoost</text>
  <text x="30" y="402" font-family="sans-serif" font-size="12" fill="#64748b">Scikit-learn</text>
  <text x="30" y="422" font-family="sans-serif" font-size="12" fill="#64748b">Streamlit</text>
</svg>
